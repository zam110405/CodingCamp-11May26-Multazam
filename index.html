<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Toast notification (non-blocking, accessible) -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <header class="app-header">
    <h1>Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" aria-label="Switch to dark mode">🌙 Dark Mode</button>
  </header>

  <main class="app-main">

    <!-- Balance Display -->
    <section class="balance-section" aria-label="Total balance">
      <h2>Total Balance</h2>
      <div id="balance" aria-live="polite">$0.00</div>
    </section>

    <!-- Add Transaction Form -->
    <section class="form-section" aria-label="Add transaction">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="tx-name">Item Name</label>
          <input
            type="text"
            id="tx-name"
            name="tx-name"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
            aria-required="true"
          />
        </div>
        <div class="form-group">
          <label for="tx-amount">Amount ($)</label>
          <input
            type="number"
            id="tx-amount"
            name="tx-amount"
            step="0.01"
            min="0.01"
            max="999999999.99"
            placeholder="0.00"
            aria-required="true"
          />
        </div>
        <div class="form-group">
          <label for="tx-category">Category</label>
          <select id="tx-category" name="tx-category" aria-required="true">
            <option value="">-- Select a category --</option>
          </select>
        </div>
        <div id="form-error" class="error-message" role="alert" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction List -->
    <section class="list-section" aria-label="Transaction list">
      <h2>Transactions</h2>
      <ul id="transaction-list" aria-label="Recorded expenses">
        <!-- Transactions rendered here by JS -->
      </ul>
    </section>

    <!-- Pie Chart -->
    <section class="chart-section" aria-label="Spending chart">
      <h2>Spending by Category</h2>
      <div class="chart-container">
        <canvas id="spending-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
        <p id="chart-empty" class="empty-state">No data to display</p>
      </div>
    </section>

    <!-- Monthly Summary -->
    <section id="monthly-summary" class="summary-section" aria-label="Monthly summary">
      <h2>Monthly Summary</h2>
      <div id="monthly-summary-content">
        <!-- Monthly groups rendered here by JS -->
      </div>
    </section>

    <!-- Custom Category Form -->
    <section class="category-section" aria-label="Add custom category">
      <h2>Add Custom Category</h2>
      <form id="category-form" novalidate>
        <div class="form-group">
          <label for="cat-name">Category Name</label>
          <input
            type="text"
            id="cat-name"
            name="cat-name"
            maxlength="100"
            placeholder="e.g. Gym"
            autocomplete="off"
            aria-required="true"
          />
        </div>
        <div id="cat-error" class="error-message" role="alert" aria-live="polite"></div>
        <button type="submit" class="btn btn-secondary">Add Category</button>
      </form>
    </section>

  </main>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
